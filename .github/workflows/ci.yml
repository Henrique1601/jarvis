name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.14
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jarvis-gemini
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Testes Windows
        run: python -m unittest discover -s tests -v

  online:
    name: Online / Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Testes do backend
        run: npm test
      - name: Build do frontend
        run: npm run build
